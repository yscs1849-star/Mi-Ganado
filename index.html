<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5E3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Ganado">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mi Ganado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5EE;--surface:#FFFFFF;--ink:#13201A;--ink2:#3F4D45;--mut:#66736B;--line:#C9D2C5;
  --pri:#1B5E3B;--onpri:#FFFFFF;--pri-soft:#DCEFE2;
  --warn:#7A4300;--warn-bg:#FFEFD0;--bad:#A3201A;--bad-bg:#FBE2DF;--ok:#14603A;--ok-bg:#D9F1E1;--info:#0F4C81;--info-bg:#DFEDFA;
  --r:14px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1511;--surface:#17211B;--ink:#EEF3EC;--ink2:#C5D0C7;--mut:#94A399;--line:#344239;
  --pri:#62CC8F;--onpri:#08210F;--pri-soft:#1E3A2A;
  --warn:#F5B863;--warn-bg:#3B2B10;--bad:#FF8F85;--bad-bg:#3C1815;--ok:#7DE2A3;--ok-bg:#173524;--info:#8CC4F5;--info-bg:#14304A}}
:root[data-theme="dark"]{
  --bg:#0E1511;--surface:#17211B;--ink:#EEF3EC;--ink2:#C5D0C7;--mut:#94A399;--line:#344239;
  --pri:#62CC8F;--onpri:#08210F;--pri-soft:#1E3A2A;
  --warn:#F5B863;--warn-bg:#3B2B10;--bad:#FF8F85;--bad-bg:#3C1815;--ok:#7DE2A3;--ok-bg:#173524;--info:#8CC4F5;--info-bg:#14304A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 28px;width:100%;max-width:560px;margin:0 auto}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1.5px solid var(--line)}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;font-weight:700;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
h1{font-size:23px;margin:0;flex:1;line-height:1.2}
h2{font-size:19px;margin:0 0 6px}
p{margin:0 0 10px}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 12px;min-height:44px}
.bk{background:none;border:0;color:var(--pri);font:inherit;font-weight:700;font-size:17px;min-height:44px;padding:0 6px 0 0;cursor:pointer}
.sub{font-size:14px;color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:17px;padding:8px 14px;cursor:pointer;text-align:center}
.btn.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:46px;font-size:15px;width:auto;padding:6px 14px}
.btn:active{transform:scale(.985)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--info);outline-offset:2px}
input,select,textarea{font:inherit;font-size:18px;min-height:54px;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.card.al{border-left:6px solid var(--warn)}
.card.al.bad{border-left-color:var(--bad)}
.card.al.info{border-left-color:var(--info)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{margin-top:10px}
.sec{font-size:14px;font-weight:700;color:var(--ink2);margin:18px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat small{display:block;font-size:13px;color:var(--mut)}
.stat b{font-size:26px;line-height:1.15}
.stat span{font-size:13px;color:var(--mut);display:block}
.row{display:flex;gap:12px;align-items:center;width:100%;min-height:70px;padding:8px 12px;margin-bottom:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.row .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .rb b{font-size:18px}
.row .rb small{font-size:14px;color:var(--mut)}
.row .rw{font-weight:700;white-space:nowrap}
.th{width:50px;height:50px;border-radius:12px;object-fit:cover;flex:none;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hd .th{width:84px;height:84px;font-size:34px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:8px;background:var(--pri-soft);color:var(--pri);margin:2px 4px 2px 0}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;padding:6px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.chip.on{border:2.5px solid var(--pri);font-weight:700;background:var(--pri-soft)}
.f{margin-bottom:14px}
.fl{font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.fh{font-size:13px;color:var(--mut);margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink2)}
.kv:first-child{border-top:0}
.kv span:last-child{color:var(--ink);font-weight:700;text-align:right}
.note{background:var(--info-bg);color:var(--info);padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0}
.warnb{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0;font-weight:700}
.badb{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0;font-weight:700}
.okb{background:var(--ok-bg);color:var(--ok);padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0}
.empty{text-align:center;padding:22px 14px}
.empty p{color:var(--ink2)}
.disp{font-size:54px;font-weight:700;text-align:center;line-height:1.1;padding:6px 0;min-height:70px}
.disp small{font-size:20px;color:var(--mut);font-weight:400}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.key{min-height:62px;font-size:26px;font-weight:700;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;cursor:pointer}
.key:active{background:var(--pri-soft)}
.tile{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.tile.on{border:3px solid var(--pri)}
.tile small{display:block;font-size:13px;color:var(--mut)}
.tile b{font-size:30px}
.done{text-align:center;padding-top:10px}
.chk{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 10px;font-weight:700}
.bigv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:12px 0;font-size:36px;font-weight:700}
.bigv small{display:block;font-size:13px;color:var(--mut);font-weight:400}
.bigv.pos{color:var(--ok)}.bigv.neg{color:var(--bad)}
.bar{height:9px;background:var(--bg);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri)}
.pr{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin:6px 0}
.pr .n{width:46%}.pr .b{flex:1;height:9px;background:var(--bg);border-radius:5px;overflow:hidden}.pr .b i{display:block;height:100%;background:var(--pri)}.pr .p{width:44px;text-align:right;color:var(--ink);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:420px}
.dlg p{font-size:18px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:90%;text-align:center}
.tgl{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:8px 14px;margin-bottom:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);font:inherit;color:var(--ink);cursor:pointer;font-size:17px}
.tgl .sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.tgl .sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on .sw{background:var(--pri)}.tgl.on .sw::after{left:23px}
textarea{min-height:110px;padding:10px 12px;font-size:14px;font-family:monospace}
.upd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--info-bg);color:var(--info);padding:8px 14px;font-weight:700}
.upd .btn{width:auto;min-height:44px}
#splash{position:fixed;inset:0;z-index:100;background:#1B5E3B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .lg{width:176px;height:176px;animation:spIn .6s ease-out both}
#splash .nm{font-size:30px;font-weight:700;animation:spIn .6s .15s ease-out both}
#splash .ld{width:168px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;opacity:0;animation:spShow .01s 1s forwards}
#splash .ld i{display:block;height:100%;width:0;background:#fff;border-radius:3px;animation:spLoad .95s 1s ease-in-out forwards}
@keyframes spIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes spShow{to{opacity:1}}
@keyframes spLoad{to{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg class="lg" viewBox="0 0 192 192"><rect x="20" y="52" width="152" height="88" rx="18" fill="#F2F5EE"/><circle cx="46" cy="96" r="8" fill="#1B5E3B"/><text x="112" y="119" text-anchor="middle" font-size="58" font-weight="700" font-family="Atkinson Hyperlegible,system-ui,sans-serif" fill="#1B5E3B">MG</text></svg><div class="nm">Mi Ganado</div><div class="ld"><i></i></div></div>
<div id="main"></div>
<div id="upd" class="upd" style="display:none" role="status"><span>Hay una versión nueva</span><button class="btn sm pri" data-a="doupd">Actualizar</button></div>
<nav id="nav" aria-label="Menú principal"></nav>
<script>
(function(){
'use strict';
var SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
setTimeout(function(){var sp=document.getElementById('splash');if(sp)sp.remove()},7000);
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

/* ================= utilidades ================= */
function p2(n){return ('0'+n).slice(-2)}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function today(){return iso(new Date())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2],12)}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((pd(b)-pd(a))/86400000)}
function fd(s){if(!s)return '';var a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]}
function ago(s){var d=diff(s,today());if(d<=0)return 'hoy';if(d===1)return 'ayer';if(d<31)return 'hace '+d+' días';var m=Math.round(d/30.4);if(m<12)return 'hace '+m+(m===1?' mes':' meses');var y=Math.round(d/365);return 'hace '+y+(y===1?' año':' años')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function f1(n,d){return n.toFixed(d).replace('.',',')}
function kg(n){return (Math.round(n*10)/10).toString().replace('.',',')+' kg'}
function numIn(s){var v=parseFloat(String(s==null?'':s).replace(',','.'));return isNaN(v)?null:v}
function moneyIn(s){var v=parseInt(String(s==null?'':s).replace(/[^\d]/g,''),10);return isNaN(v)?null:v}
function sum(a,f){return a.reduce(function(t,x){return t+(f(x)||0)},0)}

/* ================= estado y guardado ================= */
var CATS=['Engorde','Novilla o vaca','Toro'];
var STD=10800,MIN_PAIRS=10,REPRO_DAYS=283,DESTETE_DAYS=210;
var PROPS={engorde:'Engorde',crianza:'Crianza',padrote:'Padrote',novilla:'Novilla de reemplazo',pendiente:'Propósito por definir'};
var ORIG={subasta:'Subasta',compra:'Compra directa',nacimiento:'Nacimiento en la finca'};
var GCATS={alimento:'Alimento',insumos:'Insumos',mano_obra:'Mano de obra',potrero:'Potrero',otro:'Otro'};
var GF_ITEMS=['Pasto o alquiler de potrero','Alimento y concentrado','Sal y minerales','Mano de obra','Agua, luz y combustible','Cercas, herramientas y reparaciones','Otros gastos de la finca'];
var S=null,PH={},idb=null,saveT=null,NOSTORE=false;

function def(){return{v:1,finca:{nombre:'Mi finca',sim:'₡',modo:'ninguno',ref:500,gf:[]},lotes:[],animales:[],pesajes:[],productos:[],tratos:[],gastos:[],repro:[],partos:[],salidas:[],
 calib:{'Engorde':{pairs:[],div:null},'Novilla o vaca':{pairs:[],div:null},'Toro':{pairs:[],div:null}},
 cfg:{on:{parto:1,destete:1,retiro:1,dosis:1,peso:1,respaldo:1},adv:7,rem:'semana'},dis:{},lastBackup:null}}
function migrate(s){var d=def();if(!s||typeof s!=='object')return d;
 /* Cuando cambie la forma de guardar los datos, agrega aqui la conversion. Ejemplo: if((s.v||1)<2){ ...convertir...; s.v=2 } */Object.keys(d).forEach(function(k){if(s[k]==null)s[k]=d[k]});
 Object.keys(d.finca).forEach(function(k){if(s.finca[k]==null)s.finca[k]=d.finca[k]});
 CATS.forEach(function(c){if(!s.calib[c])s.calib[c]={pairs:[],div:null}});
 Object.keys(d.cfg.on).forEach(function(k){if(s.cfg.on[k]==null)s.cfg.on[k]=1});return s}

function openDB(cb){try{var r=indexedDB.open('mi-ganado',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){idb=r.result;cb()};r.onerror=function(){cb()};r.onblocked=function(){cb()}}catch(e){cb()}}
function kvGet(k,cb){if(!idb){return cb(null)}try{var q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){cb(q.result==null?null:q.result)};q.onerror=function(){cb(null)}}catch(e){cb(null)}}
function kvSet(k,v){if(!idb)return;try{idb.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
function kvDel(k){if(!idb)return;try{idb.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}}
function loadPhotos(cb){if(!idb)return cb();try{var q=idb.transaction('kv').objectStore('kv').openCursor(IDBKeyRange.bound('ph:','ph:\uffff'));q.onsuccess=function(){var c=q.result;if(c){PH[c.key.slice(3)]=c.value;c.continue()}else cb()};q.onerror=function(){cb()}}catch(e){cb()}}
function save(){clearTimeout(saveT);saveT=setTimeout(function(){if(idb){kvSet('state',S)}else{try{localStorage.setItem('mi-ganado',JSON.stringify(S))}catch(e){NOSTORE=true}}},120)}

/* ================= consultas ================= */
function A(id){return S.animales.find(function(a){return a.id===id})}
function nameOf(a){return a?(a.nombre||('Arete '+a.arete)):'?'}
function byDate(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.t||0)-(b.t||0)}
function pesajesOf(id){return S.pesajes.filter(function(p){return p.aid===id}).sort(byDate)}
function lastW(id){var p=pesajesOf(id);return p.length?p[p.length-1]:null}
function gmd(id){var p=pesajesOf(id);if(p.length<2)return null;var a=p[0],b=p[p.length-1],d=diff(a.fecha,b.fecha);return d>0?(b.kg-a.kg)/d:null}
function activos(){return S.animales.filter(function(a){return a.estado==='activo'})}
function salidaOf(id){return S.salidas.find(function(s){return s.aid===id})}
function catOf(a){return a.proposito==='padrote'?'Toro':(a.sexo==='M'?'Engorde':'Novilla o vaca')}
function lote(id){return S.lotes.find(function(l){return l.id===id})}
function gfMes(){return sum(S.finca.gf,function(g){return (g.monto||0)*(g.freq==='semana'?52/12:g.freq==='anio'?1/12:1)})}
function rateNow(){var m=S.finca.modo;if(m==='ninguno')return 0;if(m==='referencia')return S.finca.ref||0;var n=activos().length;return n?gfMes()/30.4167/n:0}
function costoInfo(id){var a=A(id),sal=salidaOf(id),end=sal?sal.fecha:today(),dias=Math.max(0,diff(a.ingreso||end,end));
 var r=(sal&&sal.gastoDia!=null)?sal.gastoDia:rateNow();
 var tr=sum(S.tratos.filter(function(t){return t.aid===id}),function(t){return t.costo});
 var gs=sum(S.gastos.filter(function(g){return g.aid===id}),function(g){return g.monto});
 if(a.loteId){var cnt=S.animales.filter(function(x){return x.loteId===a.loteId}).length||1;gs+=sum(S.gastos.filter(function(g){return !g.aid&&g.loteId===a.loteId}),function(g){return g.monto})/cnt}
 var mant=dias*r,compra=a.costo||0;return{compra:compra,tratos:tr,gastos:gs,mant:mant,dias:dias,total:compra+tr+gs+mant}}
function retiroHasta(id){var h=null;S.tratos.forEach(function(t){if(t.aid===id&&t.ret>0){var d=addD(t.fecha,t.ret);if(d>today()&&(!h||d>h))h=d}});return h}
function reproOf(id){return S.repro.filter(function(r){return r.hid===id}).sort(byDate)}
function reproState(id){var r=reproOf(id);if(!r.length)return null;var l=r[r.length-1];
 if(l.tipo==='servicio')return{e:'Servida',fep:addD(l.fecha,REPRO_DAYS)};
 if(l.tipo==='diagnostico'){if(l.res!=='prenada')return{e:'Vacía'};var sv=null;r.forEach(function(x){if(x.tipo==='servicio'&&x.fecha<=l.fecha)sv=x});return{e:'Preñada',fep:sv?addD(sv.fecha,REPRO_DAYS):null}}
 if(l.tipo==='parto')return{e:'En lactancia'};if(l.tipo==='secado')return{e:'Seca'};return null}
function partosDe(id){return S.partos.filter(function(p){return p.madreId===id})}
function sinPesar(){return activos().filter(function(a){var w=lastW(a.id);return w?diff(w.fecha,today())>30:diff(a.ingreso||today(),today())>30})}
function medDiv(pairs){var d=pairs.map(function(x){return x.p*x.p*x.l/x.w}).sort(function(a,b){return a-b}),m=Math.floor(d.length/2);return d.length%2?d[m]:(d[m-1]+d[m])/2}
function maeP(pairs,div){if(!pairs.length)return null;return sum(pairs,function(x){return Math.abs(x.p*x.p*x.l/div-x.w)/x.w})/pairs.length*100}
function divOf(cat){return S.calib[cat].div||STD}

/* ---- calibración ---- */
var CAL=0;
VIEWS.calib=function(){var cat=CATS[CAL],c=S.calib[cat],P=c.pairs,use=divOf(cat),n=P.length,cd=n?medDiv(P):null;
 var h=hdr('Calibrar la cinta')+'<div class="chips">'+CATS.map(function(x,i){return '<button class="chip'+(CAL===i?' on':'')+'" data-a="calcat" data-i="'+i+'">'+x+'</button>'}).join('')+'</div>';
 h+='<div class="grid2 mt"><div class="stat"><small>Divisor en uso</small><b style="font-size:21px">'+Math.round(use).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'</b><span>'+(c.div?'calibrado':'estándar')+'</span></div><div class="stat"><small>Pares guardados</small><b style="font-size:21px">'+n+' de '+MIN_PAIRS+'</b></div></div><div class="bar"><i style="width:'+Math.min(100,n/MIN_PAIRS*100)+'%"></i></div><div class="sub">'+(n>=MIN_PAIRS?'Ya puedes calibrar con confianza.':'Faltan '+(MIN_PAIRS-n)+' pares para calibrar con confianza.')+'</div>';
 if(n)h+='<div class="card mt"><div class="sub">Error promedio de la cinta</div>'+kvs([['Con el divisor en uso',f1(maeP(P,use),1)+' %'],['Con tu divisor calibrado ('+Math.round(cd).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+')',f1(maeP(P,cd),1)+' %']])+'</div>';
 h+=(c.div?btn('Volver al divisor estándar (10.800)','calreset','','mt'):btn('Usar mi divisor calibrado','calapply','','pri mt'))+'<div class="note">Pesa al animal con la cinta y también con la báscula. La app guarda el par sola cuando pesas con báscula un animal que ya tenía medidas de cinta en los últimos 14 días.</div>'+
 '<div class="sec">Agregar un par a mano</div><div class="grid2"><div>'+field('Perímetro (cm)','<input id="cp1" type="text" inputmode="decimal">')+'</div><div>'+field('Largo (cm)','<input id="cp2" type="text" inputmode="decimal">')+'</div></div>'+field('Peso de báscula (kg)','<input id="cp3" type="text" inputmode="decimal">')+btn('Guardar par','caladd','','pri')+'<div class="sec">Tus pares</div>';
 if(!n)h+='<div class="card empty"><p>Aún no hay pares en este grupo.</p></div>';
 P.forEach(function(x,i){var e=x.p*x.p*x.l/use,d=(e-x.w)/x.w*100;h+='<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><b>P '+x.p+' · L '+x.l+' · báscula '+kg(x.w)+'</b><div class="sub">Cinta daba '+Math.round(e)+' kg ('+(d>=0?'+':'')+f1(d,1)+' %)'+(x.aid&&A(x.aid)?' · '+esc(nameOf(A(x.aid))):'')+'</div></div><button class="btn sm" data-a="caldel" data-i="'+i+'">Quitar</button></div>'});return h};
ACT.calcat=function(d){CAL=+d.i;render()};
ACT.caladd=function(){var p=numIn($('#cp1').value),l=numIn($('#cp2').value),w=numIn($('#cp3').value);if(!p||!l||!w||p<=0||l<=0||w<=0){toast('Completa perímetro, largo y peso');return}if(p<80||p>260||l<80||l>220||w<60||w>1200){toast('Revisa los datos: alguno parece fuera de lo normal');return}
 var c=S.calib[CATS[CAL]];c.pairs.push({id:uid(),p:p,l:l,w:w,fecha:today()});if(c.div)c.div=medDiv(c.pairs);save();render()};

ACT.calreset=function(){S.calib[CATS[CAL]].div=null;save();toast('Volviste al divisor estándar');render()};

 ((lb==null||lb>=7)&&S.animales.length?'<div class="warnb">Si pierdes o dañas el celular sin respaldo, pierdes todo el historial.</div>':'')+
 '<div class="mt"></div>'+btn('Hacer respaldo ahora','backup','','pri')+'<div id="bkout"></div><div class="sec">Restaurar</div>'+
 '<label class="btn" for="rfile">Elegir un archivo de respaldo</label><input id="rfile" type="file" accept=".json,application/json" style="display:none" data-in="rfile"><div class="fh" style="margin:8px 0">O pega aquí el texto del respaldo:</div><textarea id="rtext" placeholder="Pega el respaldo"></textarea><div class="mt"></div>'+btn('Restaurar desde el texto','rtext-go')+
 '<div class="note">Restaurar reemplaza los datos actuales de este celular. El respaldo es un archivo que guardas tú o te mandas por WhatsApp; sirve aunque nunca tengas señal.</div>'};
function hostUse(n){return Promise.resolve(null)}
function backupData(){return JSON.stringify({app:'mi-ganado',v:1,appv:APP_VERSION,fecha:today(),state:S,fotos:PH})}
function saveFile(fn,data,mime){return hostUse('downloads').then(function(dl){
 if(dl)return dl.save({filename:fn,data:data}).then(function(){return 'ok'},function(e){return e&&e.code==='declined'?'declined':'fail'});
 try{var bl=new Blob([data],{type:mime}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);return 'ok'}catch(e){return 'fail'}})}
function showBackupText(data){$('#bkout').innerHTML='<div class="note mt">No se pudo guardar el archivo. Copia este texto y guárdalo (por ejemplo, mándatelo por WhatsApp):</div><textarea id="bktxt" readonly></textarea>';$('#bktxt').value=data;$('#bktxt').focus();$('#bktxt').select()}
ACT.backup=function(){var data=backupData(),fn='respaldo-finca-'+today()+'.json';saveFile(fn,data,'application/json').then(function(r){
 if(r==='ok'){S.lastBackup=today();save();toast('Respaldo guardado');render()}else if(r==='fail'){showBackupText(data)}})};
function doRestore(txt){var d;try{d=JSON.parse(txt)}catch(e){toast('El texto no es un respaldo válido');return}
 if(!d||!d.state||!Array.isArray(d.state.animales)){toast('Este archivo no parece un respaldo de Mi Ganado');return}
 ask('Se reemplazarán los datos actuales por el respaldo del '+fd(d.fecha||today())+' ('+d.state.animales.length+' animales). ¿Continuar?','Restaurar',function(){Object.keys(PH).forEach(function(k){kvDel('ph:'+k)});S=migrate(d.state);PH=d.fotos||{};Object.keys(PH).forEach(function(k){kvSet('ph:'+k,PH[k])});S.lastBackup=today();kvSet('state',S);save();toast('Datos restaurados');reset('home')},true)}
INP.rfile=function(t){var f=t.files&&t.files[0];if(!f)return;var r=new FileReader();r.onload=function(){doRestore(String(r.result))};r.onerror=function(){toast('No se pudo leer el archivo')};r.readAsText(f)};
ACT['rtext-go']=function(){var v=$('#rtext').value.trim();if(!v){toast('Pega primero el texto del respaldo');return}doRestore(v)};

/* ================= versión y actualizaciones ================= */
var APP_VERSION='1.1.0';
var SWREG=null,UPD='sw';
function showUpd(m){if(m)UPD=m;var u=$('#upd');if(u)u.style.display='flex'}
function checkNew(manual){fetch('index.html?chk='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
 var m=t.match(/APP_VERSION='([0-9.]+)'/);if(m&&m[1]!==APP_VERSION)showUpd('html');else if(manual&&!(SWREG&&SWREG.waiting))toast('Ya tienes la última versión')}).catch(function(){if(manual)toast('Sin conexión: no se pudo buscar')})}
ACT.doupd=function(){
 if(UPD==='sw'&&SWREG&&SWREG.waiting){SWREG.waiting.postMessage('SKIP_WAITING');return}
 if(UPD==='html'&&navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.controller.postMessage('REFRESH');setTimeout(function(){location.reload()},5000);return}
 location.reload()};
ACT.chkupd=function(){if(!SWREG){toast('Abre la app desde su enlace para buscar actualizaciones');return}toast('Buscando…');SWREG.update().catch(function(){});
 setTimeout(function(){if(SWREG.waiting)showUpd('sw');else checkNew(true)},1500)};
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
 var hadCtl=!!navigator.serviceWorker.controller,reloading=false;
 navigator.serviceWorker.register('sw.js').then(function(reg){SWREG=reg;
  if(reg.waiting&&navigator.serviceWorker.controller)showUpd('sw');
  reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)showUpd('sw')})});
  setTimeout(function(){checkNew()},4000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){reg.update().catch(function(){});checkNew()}})}).catch(function(){});
 navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadCtl){hadCtl=true;return}if(reloading)return;reloading=true;location.reload()});
 navigator.serviceWorker.addEventListener('message',function(e){if((e.data==='REFRESHED'||e.data==='REFRESH_FAIL')&&!reloading){reloading=true;location.reload()}});
}

 setTimeout(function(){sp.classList.add('out');setTimeout(function(){sp.remove()},420)},wait);
 try{var lv=localStorage.getItem('mg-ver');if(lv&&lv!==APP_VERSION)setTimeout(function(){toast('App actualizada a la versión '+APP_VERSION)},wait+800);localStorage.setItem('mg-ver',APP_VERSION)}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
openDB(function(){kvGet('state',function(s){if(!s&&!idb){try{s=JSON.parse(localStorage.getItem('mi-ganado'))}catch(e){}}
 if(!idb){try{localStorage.setItem('mi-test','1');localStorage.removeItem('mi-test')}catch(e){NOSTORE=true}}
 S=migrate(s);loadPhotos(function(){render();endSplash()})})});
})();
